name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# 同一个 Tag 的发布流程排队执行，不中途取消。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  draft-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check version and update configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_REPO: ${{ github.repository }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo "::error::缺少 MYGO_UPDATER_PRIVATE_KEY。"
            exit 1
          fi

          version="$(jq -er '.version | strings | select(length > 0)' mygo.json)"

          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG 与 mygo.json 中的版本 v$version 不一致。"
            exit 1
          fi

          jq -e \
            --arg repo "$EXPECTED_REPO" \
            '
              .updates.github == $repo and
              ((.updates.tagPrefix // "v") == "v") and
              ((.updates.url // "") == "") and
              (.updates.s3 == null)
            ' mygo.json > /dev/null || {
              echo "::error::更新配置不是当前仓库的 GitHub Release 配置。"
              exit 1
            }

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"

          awk -v heading="## $version" '
            { sub(/\r$/, "") }
            /^## / { inside = ($0 == heading); next }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md 缺少 ## $version 的非空更新说明。"
            exit 1
          fi

          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # API 失败就终止，不把网络或权限错误误判为 Release 不存在。
          state="$(
            gh api --paginate \
              "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft'
          )"

          case "$state" in
            "")
              gh release create "$RELEASE_TAG" \
                --repo "$GH_REPO" \
                --draft \
                --verify-tag \
                --title "$RELEASE_TAG" \
                --notes-file "$RUNNER_TEMP/notes.md"
              ;;
            true)
              echo "已有草稿，继续本次构建。"

              gh release edit "$RELEASE_TAG" \
                --repo "$GH_REPO" \
                --title "$RELEASE_TAG" \
                --notes-file "$RUNNER_TEMP/notes.md"
              ;;
            *)
              echo "::error::$RELEASE_TAG 已正式发布，不允许覆盖。请使用新的版本号。"
              exit 1
              ;;
          esac

  build:
    name: ${{ matrix.name }}
    needs: draft-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    permissions:
      contents: write

    strategy:
      fail-fast: false

      # 必须保留：
      # MyGo 上传时会合并共用的 SHA256SUMS。
      # 各平台依次上传，避免互相覆盖校验和。
      max-parallel: 1

      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/arm64,darwin/amd64

          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64,windows/arm64

          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64

    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            vendor/modules.txt

      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis

      - name: Build and upload signed packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORMS: ${{ matrix.platform }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo "::error::缺少 MYGO_UPDATER_PRIVATE_KEY。"
            exit 1
          fi

          # 防止构建开始前，草稿已经被手动发布。
          state="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft \
              --jq '.isDraft'
          )"

          if [[ "$state" != "true" ]]; then
            echo "::error::目标 Release 已不是草稿，停止上传。"
            exit 1
          fi

          # MyGo 自身会验证私钥与配置中的公钥是否匹配。
          go tool mygo build -platform "$PLATFORMS" -upload

          version="$(jq -er '.version' mygo.json)"

          IFS=',' read -ra targets <<< "$PLATFORMS"

          for platform in "${targets[@]}"; do
            target="${platform//\//-}"
            manifest="build/$target/update-$target.json"

            if [[ ! -s "$manifest" ]]; then
              echo "::error::缺少签名更新清单：$manifest"
              exit 1
            fi

            jq -e \
              --arg version "$version" \
              '
                .version == $version and
                (.signature | type == "string" and length > 0) and
                (.size | type == "number" and . > 0)
              ' "$manifest" > /dev/null || {
                echo "::error::更新清单检查失败：$manifest"
                exit 1
              }
          done

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Check assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          state="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft \
              --jq '.isDraft'
          )"

          if [[ "$state" != "true" ]]; then
            echo "::error::目标 Release 已不是草稿，停止发布。"
            exit 1
          fi

          assets="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json assets \
              --jq '.assets[].name'
          )"

          required_assets=(
            SHA256SUMS
            install.sh
            install.ps1
            update-darwin-arm64.json
            update-darwin-amd64.json
            update-windows-arm64.json
            update-windows-amd64.json
            update-linux-arm64.json
            update-linux-amd64.json
          )

          for asset in "${required_assets[@]}"; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              echo "::error::Release 缺少文件：$asset"
              exit 1
            fi
          done

          # 预发布版本不设为 latest，正式版交给 GitHub 的默认规则。
          version_without_metadata="${RELEASE_TAG%%+*}"

          if [[ "$version_without_metadata" == *-* ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --prerelease \
              --latest=false \
              --draft=false
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --prerelease=false \
              --draft=false
          fi

          {
            echo "## 发布成功"
            echo
            echo "- 版本：\`$RELEASE_TAG\`"
            echo "- 平台：macOS / Windows / Linux"
            echo "- 架构：amd64 / arm64"
          } >> "$GITHUB_STEP_SUMMARY"
