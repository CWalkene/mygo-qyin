name: Follow upstream tags

on:
  schedule:
    # 北京时间每天 04:43。
    - cron: "43 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: follow-upstream-tags
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync-and-tag:
    name: Sync upstream and create tag

    # 避免手动选择其他分支后，执行不同分支中的同步逻辑。
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::缺少 UPSTREAM_SYNC_TOKEN。"
            exit 1
          fi

      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge latest upstream tag and create fork tag
        id: sync
        env:
          UPSTREAM_URL: https://github.com/Amamiya23/mygo-qyin.git
          MY_PUBLIC_KEY: 4MYHRPaByPnU80lF0aCZ1vB7pROD6Fxsve7Ijj6wh84=
          MY_UPDATE_REPO: CWalkene/mygo-qyin
        run: |
          set -euo pipefail

          echo "changed=false" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # 只选择 v数字.数字.数字 形式的正式版。
          upstream_tags="$(git ls-remote --tags --refs "$UPSTREAM_URL")"

          tag="$(
            printf '%s\n' "$upstream_tags" \
              | awk '{ sub("^refs/tags/", "", $2); print $2 }' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$tag" ]]; then
            echo "上游没有符合格式的正式版 Tag。"
            echo "上游没有符合格式的正式版 Tag。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "上游最新正式版 Tag：$tag"

          # 已存在的 Tag 不移动、不覆盖。
          own_tag="$(git ls-remote --tags --refs origin "refs/tags/$tag")"

          if [[ -n "$own_tag" ]]; then
            echo "自己的仓库已有 $tag，本次跳过。"
            echo "已存在 \`$tag\`，本次跳过。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 同步前确认 main 已配置自己的公钥和更新仓库。
          jq -e \
            --arg key "$MY_PUBLIC_KEY" \
            --arg repo "$MY_UPDATE_REPO" \
            '
              .updates.publicKey == $key and
              .updates.github == $repo
            ' mygo.json > /dev/null || {
              echo "::error::请先修正 main 中的公钥和更新仓库配置。"
              exit 1
            }

          # 记录同步前自己的版本，稍后用于恢复自己的 Actions。
          fork_head="$(git rev-parse HEAD)"

          # 只获取这个上游 Tag 的代码，不复制它的 Tag 引用。
          git fetch --no-tags "$UPSTREAM_URL" "refs/tags/$tag"
          upstream_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"

          if ! git merge \
            -m "chore(sync): merge upstream $tag" \
            "$upstream_commit"; then
            echo "::error::合并失败，可能存在冲突。未推送任何修改，请手动处理后重新运行。"
            git merge --abort || true
            exit 1
          fi

          # 成功合并后保留自己原来的工作流。
          # 上游 Actions 的变更需要自行审查、手动引入。
          git restore \
            --source="$fork_head" \
            --staged \
            --worktree \
            -- .github/workflows

          # 保留自己的公钥和更新仓库。
          jq \
            --arg key "$MY_PUBLIC_KEY" \
            --arg repo "$MY_UPDATE_REPO" \
            '
              .updates.publicKey = $key |
              .updates.github = $repo
            ' mygo.json > "$RUNNER_TEMP/mygo.json"

          cat "$RUNNER_TEMP/mygo.json" > mygo.json

          version="$(jq -er '.version | strings | select(length > 0)' mygo.json)"

          if [[ "v$version" != "$tag" ]]; then
            echo "::error::合并后版本 v$version 与 $tag 不一致，停止发布。"
            exit 1
          fi

          awk -v heading="## $version" '
            { sub(/\r$/, "") }
            /^## / { inside = ($0 == heading); next }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md 缺少该版本的非空更新说明。"
            exit 1
          fi

          git add mygo.json .github/workflows

          if ! git diff --cached --quiet; then
            git commit \
              -m "chore(sync): preserve fork configuration for $tag"
          fi

          # Tag 指向包含自己配置和工作流的最终代码。
          git tag "$tag" HEAD

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 清理逻辑依赖此固定名称，无输出，但不要删除或随意改名。
      - name: Mark no-update run
        if: steps.sync.outputs.changed == 'false'
        run: ":"

      - name: Push branch and tag atomically
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.sync.outputs.tag }}
        run: |
          set -euo pipefail

          # 仅在推送步骤使用 PAT，不持久化到 Git 配置。
          auth="$(
            printf 'x-access-token:%s' "$SYNC_TOKEN" \
              | base64 \
              | tr -d '\r\n'
          )"

          echo "::add-mask::$auth"

          # 不强推。分支有并发更新或 Tag 已出现时整体失败。
          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin \
              HEAD:refs/heads/main \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          {
            echo "## 同步成功"
            echo
            echo "- 上游版本：\`$RELEASE_TAG\`"
            echo "- 已保留自己的公钥和更新仓库"
            echo "- 已保留自己的 Actions"
            echo "- 已原子推送 main 和 Tag"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean old no-update runs
        # 静默清理；错误仍保留，且不影响已经成功的同步。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: upstream-tag.yml
          KEEP_DAYS: "3"
        run: |
          set -euo pipefail

          cutoff="$(date -u -d "$KEEP_DAYS days ago" '+%Y-%m-%dT%H:%M:%SZ')"

          # 先收集候选，再删除，避免删除过程中影响分页。
          gh api --paginate \
            "repos/$GH_REPO/actions/workflows/$WORKFLOW_FILE/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | {
              id,
              updated_at,
              run_attempt,
              event
            }' \
            > "$RUNNER_TEMP/sync-runs.jsonl"

          jq -r \
            --arg cutoff "$cutoff" \
            --arg current "$CURRENT_RUN_ID" \
            '
              select(
                (.id | tostring) != $current and
                .updated_at < $cutoff and
                .run_attempt == 1 and
                (.event == "schedule" or .event == "workflow_dispatch")
              )
              | .id
            ' "$RUNNER_TEMP/sync-runs.jsonl" \
            > "$RUNNER_TEMP/cleanup-candidates.txt"

          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue

            gh api --paginate --slurp \
              "repos/$GH_REPO/actions/runs/$run_id/jobs?filter=all&per_page=100" \
              > "$RUNNER_TEMP/run-jobs.json"

            # 必须有成功的无更新标记，且未成功执行推送。
            # 无法确认的记录一律保留。
            if ! jq -e '
              [.[].jobs[]] as $jobs
              | (
                  ($jobs | length) > 0
                  and all($jobs[]; .conclusion == "success")
                  and any(
                    $jobs[].steps[]?;
                    .name == "Mark no-update run"
                    and .conclusion == "success"
                  )
                  and (
                    any(
                      $jobs[].steps[]?;
                      .name == "Push branch and tag atomically"
                      and .conclusion == "success"
                    ) | not
                  )
                )
            ' "$RUNNER_TEMP/run-jobs.json" > /dev/null; then
              continue
            fi

            # 删除前再次确认，保留已重新运行或状态变化的记录。
            gh api \
              "repos/$GH_REPO/actions/runs/$run_id" \
              > "$RUNNER_TEMP/run-state.json"

            if ! jq -e \
              --arg cutoff "$cutoff" \
              '
                .status == "completed" and
                .conclusion == "success" and
                .run_attempt == 1 and
                .updated_at < $cutoff
              ' "$RUNNER_TEMP/run-state.json" > /dev/null; then
              continue
            fi

            gh api --method DELETE \
              "repos/$GH_REPO/actions/runs/$run_id" > /dev/null
          done < "$RUNNER_TEMP/cleanup-candidates.txt"
