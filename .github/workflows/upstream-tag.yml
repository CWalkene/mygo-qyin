name: Follow upstream tags

on:
  schedule:
    # 北京时间每天 04:43
    - cron: "43 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: follow-upstream-tags
  cancel-in-progress: false

jobs:
  sync-and-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge latest upstream tag and create my tag
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/Amamiya23/mygo-qyin.git
          MY_PUBLIC_KEY: "4MYHRPaByPnU80lF0aCZ1vB7pROD6Fxsve7Ijj6wh84="
          MY_UPDATE_REPO: "CWalkene/mygo-qyin"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 按版本号排序，只选择 v数字.数字.数字 形式的正式版。
          # 不把上游 Tag 直接导入自己的 tags 命名空间。
          upstream_tags=$(git ls-remote --tags --refs "$UPSTREAM_URL")

          tag=$(
            printf '%s\n' "$upstream_tags" \
              | awk '{sub("refs/tags/", "", $2); print $2}' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$tag" ]; then
            echo "上游没有符合格式的正式版 Tag。"
            exit 0
          fi

          echo "上游最新正式版 Tag：$tag"

          # 自己仓库已有同名 Tag 时，不移动、不覆盖。
          own_tag=$(git ls-remote --tags --refs origin "refs/tags/$tag")
          if [ -n "$own_tag" ]; then
            echo "自己的仓库已有 $tag，本次跳过。"
            exit 0
          fi

          # 合并前先验证自己的配置，避免使用错误的密钥配置。
          jq -e \
            --arg key "$MY_PUBLIC_KEY" \
            --arg repo "$MY_UPDATE_REPO" \
            '.updates.publicKey == $key and .updates.github == $repo' \
            mygo.json > /dev/null || {
              echo "::error::请先修正 main 中的公钥和更新仓库配置。"
              exit 1
            }

          # 只获取这个上游 Tag 的代码，不复制它的 Tag 引用。
          git fetch --no-tags "$UPSTREAM_URL" "refs/tags/$tag"
          upstream_commit=$(git rev-parse 'FETCH_HEAD^{commit}')

          if ! git merge --no-edit "$upstream_commit"; then
            echo "::error::合并冲突。未推送任何修改，请手动处理后重新运行。"
            git merge --abort || true
            exit 1
          fi

          # 合并成功后，明确保留自己的公钥和更新来源。
          jq \
            --arg key "$MY_PUBLIC_KEY" \
            --arg repo "$MY_UPDATE_REPO" \
            '.updates.publicKey = $key | .updates.github = $repo' \
            mygo.json > "$RUNNER_TEMP/mygo.json"

          cat "$RUNNER_TEMP/mygo.json" > mygo.json

          # 对应现有 release.yml 的版本检查。
          version=$(jq -r '.version' mygo.json)
          if [ "v$version" != "$tag" ]; then
            echo "::error::合并后版本 v$version 与 $tag 不一致，停止发布。"
            exit 1
          fi

          # 对应现有 release.yml 的更新日志检查。
          awk -v heading="## $version" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"

          if ! test -s "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md 缺少该版本的非空更新说明。"
            exit 1
          fi

          git add mygo.json
          if ! git diff --cached --quiet; then
            git commit -m "Keep fork update configuration for $tag"
          fi

          # 新 Tag 指向合并后的代码，包含自己的修改。
          git tag "$tag" HEAD

          # 不强制推送。远程分支有并发更新时会失败，而非覆盖。
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/$tag:refs/tags/$tag"
